<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON STORM γ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0612; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Share Tech Mono', 'Consolas', 'Monaco', 'Courier New', monospace; }
#game-container { position: relative; }
#pixi-play { position: absolute; z-index: 1; pointer-events: none; }
#game { position: relative; z-index: 2; display: block; }
</style>
</head>
<body>
<div id="game-container">
    <canvas id="game"></canvas>
</div>

<!-- PixiJS v8 — WebGPU/WebGL renderer with Canvas fallback -->
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
<!-- pixi-filters v6 (the PixiJS v8 line) — Shockwave, Godray and Glitch effects; registers PIXI.filters -->
<script src="https://cdn.jsdelivr.net/npm/pixi-filters@6.1.5/dist/pixi-filters.min.js"></script>

<!-- Source modules loaded in dependency order -->
<script src="src/constants.js"></script>
<script src="src/backdrops.js"></script>
<script src="src/renderer.js"></script>
<script src="src/config.js"></script>
<script src="src/input.js"></script>
<script src="src/audio.js"></script>
<script src="src/storage.js"></script>
<script src="src/ui-systems.js"></script>
<script src="src/neon.js"></script>
<script src="src/ui-kit.js"></script>
<script src="src/particles.js"></script>
<script src="src/bullets.js"></script>
<script src="src/scoring.js"></script>
<script src="src/enemies.js"></script>
<script src="src/midbosses.js"></script>
<script src="src/waves.js"></script>
<script src="src/level-systems.js"></script>
<script src="src/bosses.js"></script>
<script src="src/player.js"></script>
<script src="src/background.js"></script>
<script src="src/hud.js"></script>
<script src="src/menus.js"></script>
<script src="src/game.js"></script>
<script src="src/main.js"></script>
</body>
</html>
